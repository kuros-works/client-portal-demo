name: verify-rls

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-rls-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify-rls:
    name: verify-rls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # version は書かない（package.json の packageManager を読む）
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm supabase start -x realtime,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,studio,postgres-meta

      - name: Write .env.seed.local
        run: pnpm supabase status -o env > .env.seed.local

      - name: Seed
        run: node scripts/local-seed/seed.mjs

      - name: Verify RLS
        run: node scripts/local-seed/verify-rls.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-rls-report
          path: scripts/local-seed/reports/verify-rls-latest.md
          if-no-files-found: ignore
